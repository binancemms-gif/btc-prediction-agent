<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BTC Prediction Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 40px; }
    .card { background: #161b22; padding: 24px; border-radius: 12px; max-width: 480px; }
    button { background: #238636; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    .up { color: #3fb950; } .down { color: #f85149; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BTC Prediction Agent</h1>
    <p>Short-term 5/10 min range analysis. Not financial advice.</p>
    <button onclick="load()">Refresh Prediction</button>
    <div id="out" style="margin-top:20px;"></div>
  </div>
  <script>
    async function load() {
      const r = await fetch('/predict');
      const d = await r.json();
      document.getElementById('out').innerHTML = `
        <p><strong>Price:</strong> $${d.price}</p>
        <p><strong>5min:</strong> <span class="${d.prediction_5min.toLowerCase()}">${d.prediction_5min}</span></p>
        <p><strong>10min:</strong> <span class="${d.prediction_10min.toLowerCase()}">${d.prediction_10min}</span></p>
        <p>${d.notes}</p>
        <small>${d.timestamp}</small>
      `;
    }
    load();
  </script>
</body>
</html>
